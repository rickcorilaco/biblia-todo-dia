<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bíblia Certa - Leitura Diária</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#10B981', // Verde Esmeralda (Estilo Duolingo)
                        primaryDark: '#059669',
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans antialiased flex flex-col">

    <!-- TELA DE AUTENTICAÇÃO (PRIMEIRA TELA) -->
    <div id="auth-screen" class="fixed inset-0 z-50 bg-slate-50 dark:bg-slate-900 flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white dark:bg-slate-800 rounded-2xl shadow-xl p-8 border border-slate-100 dark:border-slate-700">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-emerald-100 dark:bg-emerald-900/30 text-primary rounded-2xl mb-4">
                    <i data-lucide="book-open" class="w-8 h-8"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-tight">Bíblia Certa</h1>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Seu hábito diário de leitura na nuvem</p>
            </div>

            <!-- Abas Login / Cadastro -->
            <div class="flex rounded-xl bg-slate-100 dark:bg-slate-700/50 p-1 mb-6">
                <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-white dark:bg-slate-600 shadow-sm transition">Entrar</button>
                <button id="tab-register" onclick="switchAuthTab('register')" class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-500 hover:text-slate-900 dark:hover:text-white transition">Cadastrar</button>
            </div>

            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">E-mail</label>
                    <input type="email" id="auth-email" required class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-primary text-sm" placeholder="seu@email.com">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Senha</label>
                    <input type="password" id="auth-password" required minlength="6" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-primary text-sm" placeholder="••••••••">
                </div>

                <div id="auth-error" class="text-xs text-red-500 hidden"></div>

                <button type="submit" id="auth-submit-btn" class="w-full py-3 bg-primary hover:bg-primaryDark text-white font-bold rounded-xl shadow-lg shadow-emerald-500/20 transition flex items-center justify-center gap-2">
                    <span id="auth-btn-text">Entrar na Conta</span>
                </button>
            </form>
        </div>
    </div>

    <!-- APLICATIVO PRINCIPAL (OCULTO ATÉ LOGAR) -->
    <div id="app-container" class="hidden flex-1 flex flex-col h-full overflow-hidden">
        
        <!-- HEADER / BARRA SUPERIOR -->
        <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-4 py-3 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-100 dark:bg-emerald-900/30 text-primary flex items-center justify-center">
                    <i data-lucide="book-open" class="w-6 h-6"></i>
                </div>
                <div>
                    <h2 class="font-bold text-base leading-tight">Bíblia Certa</h2>
                    <p class="text-xs text-slate-500 dark:text-slate-400" id="user-email-display">Carregando...</p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <!-- Contador de Ofensiva (Streak) -->
                <div class="flex items-center gap-1.5 bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-900/50 px-3 py-1.5 rounded-full">
                    <i data-lucide="flame" class="w-5 h-5 text-orange-500 fill-orange-500 animate-pulse"></i>
                    <span id="header-streak" class="font-extrabold text-orange-600 dark:text-orange-400 text-sm">0</span>
                </div>
                <!-- Botão Logout -->
                <button onclick="handleLogout()" title="Sair da Conta" class="p-2 text-slate-400 hover:text-red-500 transition rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                </button>
            </div>
        </header>

        <!-- CORPO PRINCIPAL -->
        <main class="flex-1 overflow-y-auto p-4 max-w-4xl w-full mx-auto space-y-6">
            
            <!-- CARD DE PRÓXIMA LEITURA -->
            <div class="bg-gradient-to-br from-emerald-500 to-emerald-700 rounded-3xl p-6 text-white shadow-xl relative overflow-hidden">
                <div class="absolute -right-6 -bottom-6 opacity-10">
                    <i data-lucide="book-open" class="w-48 h-48"></i>
                </div>
                <div class="relative z-10">
                    <span class="inline-block bg-white/20 text-xs font-bold uppercase tracking-wider px-3 py-1 rounded-full mb-3">Próxima Leitura</span>
                    <h3 id="next-reading-title" class="text-2xl font-extrabold mb-2">Gênesis 1</h3>
                    <p class="text-emerald-100 text-sm mb-6">Continue sua jornada diária e mantenha sua ofensiva ativa.</p>
                    <button onclick="openReaderCurrent()" class="bg-white text-emerald-800 font-bold px-6 py-3 rounded-2xl shadow-lg hover:bg-emerald-50 transition flex items-center gap-2">
                        <i data-lucide="play" class="w-5 h-5 fill-emerald-800"></i>
                        <span>Ler Agora</span>
                    </button>
                </div>
            </div>

            <!-- ESTATÍSTICAS RÁPIDAS -->
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-100 dark:border-slate-700 flex items-center gap-4">
                    <div class="p-3 bg-blue-100 dark:bg-blue-900/30 text-blue-600 rounded-xl">
                        <i data-lucide="award" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <p class="text-xs text-slate-500 dark:text-slate-400">XP Total</p>
                        <h4 id="stat-xp" class="text-lg font-bold">0 XP</h4>
                    </div>
                </div>
                <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-100 dark:border-slate-700 flex items-center gap-4">
                    <div class="p-3 bg-emerald-100 dark:bg-emerald-900/30 text-emerald-600 rounded-xl">
                        <i data-lucide="check-circle-2" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <p class="text-xs text-slate-500 dark:text-slate-400">Capítulos Lidos</p>
                        <h4 id="stat-completed" class="text-lg font-bold">0 / 1189</h4>
                    </div>
                </div>
            </div>

            <!-- LISTA DOS LIVROS DA BÍBLIA -->
            <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 border border-slate-100 dark:border-slate-700 shadow-sm">
                <div class="flex items-center justify-between mb-4">
                    <h4 class="font-bold text-lg">Livros da Bíblia</h4>
                    <div class="flex gap-2">
                        <button onclick="filterTestament('all')" id="btn-test-all" class="text-xs font-bold px-3 py-1.5 rounded-lg bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300">Todos</button>
                        <button onclick="filterTestament('vt')" id="btn-test-vt" class="text-xs font-bold px-3 py-1.5 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700">Antigo</button>
                        <button onclick="filterTestament('nt')" id="btn-test-nt" class="text-xs font-bold px-3 py-1.5 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700">Novo</button>
                    </div>
                </div>
                <div id="books-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 max-h-96 overflow-y-auto pr-2">
                    <!-- Preenchido via JS -->
                </div>
            </div>

        </main>
    </div>

    <!-- MODAL DE LEITURA -->
    <div id="reader-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-2xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden border border-slate-100 dark:border-slate-700">
            <!-- Header Modal -->
            <div class="p-4 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between shrink-0">
                <h3 id="reader-modal-title" class="font-extrabold text-lg">Carregando...</h3>
                <button onclick="closeReader()" class="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-white rounded-xl">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            <!-- Conteúdo Versículos -->
            <div id="reader-content" class="flex-1 overflow-y-auto p-6 space-y-4 text-lg leading-relaxed text-slate-700 dark:text-slate-200">
                <div class="flex justify-center items-center py-12">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary"></div>
                </div>
            </div>
            <!-- Footer Modal com Botão Concluir -->
            <div class="p-4 border-t border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50 flex justify-end shrink-0">
                <button onclick="completeCurrentReading()" class="w-full sm:w-auto px-6 py-3 bg-primary hover:bg-primaryDark text-white font-bold rounded-xl shadow-lg shadow-emerald-500/20 transition flex items-center justify-center gap-2">
                    <i data-lucide="check" class="w-5 h-5"></i>
                    <span>Concluir Capítulo e Avançar</span>
                </button>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE CONFIGURAÇÃO E LÓGICA -->
    <script>
        // CONFIGURAÇÃO DO SUPABASE
        const SUPABASE_URL = "https://flpiirpxqlzuvqgbjqbz.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZscGlpcnB4cWx6dXZxZ2JqcWJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MjA0NzAsImV4cCI6MjEwODA5NjQ3MH0.8jN5iwMNmkC2wjbv0d7l1rFn7J7EDNnWckwPLJWGx7w";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentAuthMode = 'login';
        let currentUser = null;
        let userProfile = { streak: 0, xp: 0, last_reading_date: null };
        let currentReadingBook = "Gênesis";
        let currentReadingChapter = 1;
        let completedChaptersList = [];

        // DADOS DOS LIVROS DA BÍBLIA
        const bibleBooks = [
            { name: "Gênesis", chapters: 50, testament: "vt" },
            { name: "Êxodo", chapters: 40, testament: "vt" },
            { name: "Levítico", chapters: 27, testament: "vt" },
            { name: "Números", chapters: 36, testament: "vt" },
            { name: "Deuteronômio", chapters: 34, testament: "vt" },
            { name: "Josué", chapters: 24, testament: "vt" },
            { name: "Juízes", chapters: 21, testament: "vt" },
            { name: "Rute", chapters: 4, testament: "vt" },
            { name: "1 Samuel", chapters: 31, testament: "vt" },
            { name: "2 Samuel", chapters: 24, testament: "vt" },
            { name: "1 Reis", chapters: 22, testament: "vt" },
            { name: "2 Reis", chapters: 25, testament: "vt" },
            { name: "1 Crônicas", chapters: 29, testament: "vt" },
            { name: "2 Crônicas", chapters: 36, testament: "vt" },
            { name: "Esdras", chapters: 10, testament: "vt" },
            { name: "Neemias", chapters: 13, testament: "vt" },
            { name: "Ester", chapters: 10, testament: "vt" },
            { name: "Jó", chapters: 42, testament: "vt" },
            { name: "Salmos", chapters: 150, testament: "vt" },
            { name: "Provérbios", chapters: 31, testament: "vt" },
            { name: "Eclesiastes", chapters: 12, testament: "vt" },
            { name: "Cânticos", chapters: 8, testament: "vt" },
            { name: "Isaías", chapters: 66, testament: "vt" },
            { name: "Jeremias", chapters: 52, testament: "vt" },
            { name: "Lamentações", chapters: 5, testament: "vt" },
            { name: "Ezequiel", chapters: 48, testament: "vt" },
            { name: "Daniel", chapters: 12, testament: "vt" },
            { name: "Oseias", chapters: 14, testament: "vt" },
            { name: "Joel", chapters: 3, testament: "vt" },
            { name: "Amós", chapters: 9, testament: "vt" },
            { name: "Obadias", chapters: 1, testament: "vt" },
            { name: "Jonas", chapters: 4, testament: "vt" },
            { name: "Miqueias", chapters: 7, testament: "vt" },
            { name: "Naum", chapters: 3, testament: "vt" },
            { name: "Habacuque", chapters: 3, testament: "vt" },
            { name: "Sofonias", chapters: 3, testament: "vt" },
            { name: "Ageu", chapters: 2, testament: "vt" },
            { name: "Zacarias", chapters: 14, testament: "vt" },
            { name: "Malaquias", chapters: 4, testament: "vt" },
            { name: "Mateus", chapters: 28, testament: "nt" },
            { name: "Marcos", chapters: 16, testament: "nt" },
            { name: "Lucas", chapters: 24, testament: "nt" },
            { name: "João", chapters: 21, testament: "nt" },
            { name: "Atos", chapters: 28, testament: "nt" },
            { name: "Romanos", chapters: 16, testament: "nt" },
            { name: "1 Coríntios", chapters: 16, testament: "nt" },
            { name: "2 Coríntios", chapters: 13, testament: "nt" },
            { name: "Gálatas", chapters: 6, testament: "nt" },
            { name: "Efésios", chapters: 6, testament: "nt" },
            { name: "Filipenses", chapters: 4, testament: "nt" },
            { name: "Colossenses", chapters: 4, testament: "nt" },
            { name: "1 Tessalonicenses", chapters: 5, testament: "nt" },
            { name: "2 Tessalonicenses", chapters: 3, testament: "nt" },
            { name: "1 Timóteo", chapters: 6, testament: "nt" },
            { name: "2 Timóteo", chapters: 4, testament: "nt" },
            { name: "Tito", chapters: 3, testament: "nt" },
            { name: "Filemom", chapters: 1, testament: "nt" },
            { name: "Hebreus", chapters: 13, testament: "nt" },
            { name: "Tiago", chapters: 5, testament: "nt" },
            { name: "1 Pedro", chapters: 5, testament: "nt" },
            { name: "2 Pedro", chapters: 3, testament: "nt" },
            { name: "1 João", chapters: 5, testament: "nt" },
            { name: "2 João", chapters: 1, testament: "nt" },
            { name: "3 João", chapters: 1, testament: "nt" },
            { name: "Judas", chapters: 1, testament: "nt" },
            { name: "Apocalipse", chapters: 22, testament: "nt" }
        ];

        document.addEventListener("DOMContentLoaded", async () => {
            lucide.createIcons();
            checkUserSession();
        });

        async function checkUserSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
                showApp();
            } else {
                showAuth();
            }
        }

        function switchAuthTab(mode) {
            currentAuthMode = mode;
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const btnText = document.getElementById('auth-btn-text');

            if (mode === 'login') {
                tabLogin.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-white dark:bg-slate-600 shadow-sm transition";
                tabRegister.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-slate-500 hover:text-slate-900 dark:hover:text-white transition";
                btnText.innerText = "Entrar na Conta";
            } else {
                tabRegister.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-white dark:bg-slate-600 shadow-sm transition";
                tabLogin.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-slate-500 hover:text-slate-900 dark:hover:text-white transition";
                btnText.innerText = "Criar Conta";
            }
        }

        async function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const errorDiv = document.getElementById('auth-error');
            errorDiv.classList.add('hidden');

            if (currentAuthMode === 'login') {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) {
                    errorDiv.innerText = error.message;
                    errorDiv.classList.remove('hidden');
                } else {
                    currentUser = data.user;
                    showApp();
                }
            } else {
                const { data, error } = await supabaseClient.auth.signUp({ email, password });
                if (error) {
                    errorDiv.innerText = error.message;
                    errorDiv.classList.remove('hidden');
                } else {
                    alert("Conta criada com sucesso! Faça login.");
                    switchAuthTab('login');
                }
            }
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            currentUser = null;
            showAuth();
        }

        function showAuth() {
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('app-container').classList.add('hidden');
        }

        async function showApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            document.getElementById('user-email-display').innerText = currentUser.email;
            await loadUserData();
            renderBooksList();
            updateDashboard();
        }

        async function loadUserData() {
            // Carregar leituras do usuário
            const { data, error } = await supabaseClient
                .from('leituras')
                .select('*')
                .eq('user_id', currentUser.id);

            if (data) {
                completedChaptersList = data.map(item => `${item.livro}_${item.capitulo}`);
            }

            // Carregar perfil (streak e xp)
            const { data: profileData } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('id', currentUser.id)
                .single();

            if (profileData) {
                userProfile = profileData;
            } else {
                // Criar perfil padrão se não existir
                await supabaseClient.from('profiles').insert([{ id: currentUser.id, streak: 0, xp: 0 }]);
            }
        }

        function updateDashboard() {
            document.getElementById('header-streak').innerText = userProfile.streak || 0;
            document.getElementById('stat-xp').innerText = `${userProfile.xp || 0} XP`;
            document.getElementById('stat-completed').innerText = `${completedChaptersList.length} / 1189`;

            // Definir próxima leitura (primeira pendente)
            let foundNext = false;
            for (let b of bibleBooks) {
                for (let c = 1; c <= b.chapters; c++) {
                    if (!completedChaptersList.includes(`${b.name}_${c}`)) {
                        currentReadingBook = b.name;
                        currentReadingChapter = c;
                        foundNext = true;
                        break;
                    }
                }
                if (foundNext) break;
            }

            if (!foundNext) {
                currentReadingBook = "Apocalipse";
                currentReadingChapter = 22;
            }

            document.getElementById('next-reading-title').innerText = `${currentReadingBook} ${currentReadingChapter}`;
        }

        function renderBooksList(filter = 'all') {
            const container = document.getElementById('books-grid');
            container.innerHTML = '';

            const filteredBooks = bibleBooks.filter(b => filter === 'all' || b.testament === filter);

            filteredBooks.forEach(book => {
                const completedInBook = Array.from({length: book.chapters}, (_, i) => `${book.name}_${i+1}`)
                    .filter(item => completedChaptersList.includes(item)).length;
                
                const percent = Math.round((completedInBook / book.chapters) * 100);

                const card = document.createElement('div');
                card.className = "p-3 rounded-2xl border border-slate-100 dark:border-slate-700 hover:border-primary transition cursor-pointer flex flex-col justify-between";
                card.onclick = () => openReader(book.name, 1);
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <h5 class="font-bold text-sm">${book.name}</h5>
                        <span class="text-xs text-slate-400">${completedInBook}/${book.chapters}</span>
                    </div>
                    <div class="w-full bg-slate-100 dark:bg-slate-700 h-1.5 rounded-full overflow-hidden">
                        <div class="bg-primary h-full rounded-full" style="width: ${percent}%"></div>
                    </div>
                `;
                container.appendChild(card);
            });
            lucide.createIcons();
        }

        function filterTestament(type) {
            document.getElementById('btn-test-all').className = type === 'all' ? "text-xs font-bold px-3 py-1.5 rounded-lg bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300" : "text-xs font-bold px-3 py-1.5 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700";
            document.getElementById('btn-test-vt').className = type === 'vt' ? "text-xs font-bold px-3 py-1.5 rounded-lg bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300" : "text-xs font-bold px-3 py-1.5 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700";
            document.getElementById('btn-test-nt').className = type === 'nt' ? "text-xs font-bold px-3 py-1.5 rounded-lg bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300" : "text-xs font-bold px-3 py-1.5 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700";
            renderBooksList(type);
        }

        function openReaderCurrent() {
            openReader(currentReadingBook, currentReadingChapter);
        }

        async function openReader(book, chapter) {
            currentReadingBook = book;
            currentReadingChapter = chapter;
            document.getElementById('reader-modal-title').innerText = `${book} ${chapter}`;
            document.getElementById('reader-content').innerHTML = `
                <div class="flex justify-center items-center py-12">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary"></div>
                </div>
            `;
            document.getElementById('reader-modal').classList.remove('hidden');

            try {
                // Buscando da API pública gratuita Almeida
                const response = await fetch(`https://bible-api.com/${encodeURIComponent(book)}%20${chapter}?translation=almeida`);
                const data = await response.json();

                if (data && data.verses) {
                    let html = '';
                    data.verses.forEach(v => {
                        html += `<p><sup class="text-xs text-primary font-bold mr-1">${v.verse}</sup> ${v.text}</p>`;
                    });
                    document.getElementById('reader-content').innerHTML = html;
                } else {
                    document.getElementById('reader-content').innerHTML = `<p class="text-red-500">Não foi possível carregar o texto deste capítulo.</p>`;
                }
            } catch (err) {
                document.getElementById('reader-content').innerHTML = `<p class="text-red-500">Erro ao conectar com a API da Bíblia.</p>`;
            }
        }

        function closeReader() {
            document.getElementById('reader-modal').classList.add('hidden');
        }

        async function completeCurrentReading() {
            const key = `${currentReadingBook}_${currentReadingChapter}`;
            if (!completedChaptersList.includes(key)) {
                // Salvar no Supabase
                await supabaseClient.from('leituras').insert([{
                    user_id: currentUser.id,
                    livro: currentReadingBook,
                    capitulo: currentReadingChapter,
                    data_leitura: new Date().toISOString().split('T')[0]
                }]);

                completedChaptersList.push(key);

                // Atualizar streak e XP
                const today = new Date().toISOString().split('T')[0];
                let newStreak = userProfile.streak || 0;
                if (userProfile.last_reading_date !== today) {
                    newStreak += 1;
                }
                const newXp = (userProfile.xp || 0) + 50;

                await supabaseClient.from('profiles').update({
                    streak: newStreak,
                    xp: newXp,
                    last_reading_date: today
                }).eq('id', currentUser.id);

                userProfile.streak = newStreak;
                userProfile.xp = newXp;
                userProfile.last_reading_date = today;
            }

            closeReader();
            updateDashboard();
            renderBooksList();
        }
    </script>
</body>
</html>
